name: Deploy to Render (Production)

on:
  push:
    branches: [production]     # deploy when 'production' branch changes
  workflow_dispatch:           # allow manual runs

permissions:
  contents: read

env:
  PRODUCTION_URL: https://bp-calculator.onrender.com

jobs:
  deploy:
    name: Deploy + Test Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1) Trigger Render Deploy
      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
        env:
          RENDER_DEPLOY_HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_PROD" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_PROD"
            exit 1
          fi
          echo "Triggering Render deploy..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_PROD"
          echo "Deploy triggered."

      # 2) Wait until the site is serving real HTML
      - name: Warm up production
        run: |
          URL="${PRODUCTION_URL}"
          echo "⏳ Waiting for $URL ..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            if [ "$STATUS" -eq 200 ]; then
              BODY=$(curl -s "$URL/")
              if echo "$BODY" | grep -qiE "Systolic|Diastolic|Blood Pressure|Ideal Blood Pressure"; then
                echo "Site is ready"
                sleep 5
                exit 0
              fi
            fi
            echo "[$i/60] Not ready yet (status=$STATUS). Sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for $URL"
          exit 1

      # 3) Install and run Playwright tests
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers & Deps
        run: npx playwright install --with-deps

      - name: Run Playwright tests against production
        run: npx playwright test
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore