name: Deploy to Render (Production)

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_URL: https://bp-calculator.onrender.com

jobs:
  deploy:
    name: Deploy + Test Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # wait until the app is actually up
      - name: Warm up production
        run: |
          URL="${PRODUCTION_URL}"
          echo "⏳ Waiting for $URL ..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
            if [ "$STATUS" -eq 200 ]; then
              BODY=$(curl -s "$URL/")
              if echo "$BODY" | grep -qiE "Systolic|Diastolic|Ideal Blood Pressure|Blood Pressure"; then
                echo "Site is ready"
                sleep 5
                exit 0
              fi
            fi
            echo "[$i/60] Not ready yet (status=$STATUS). Sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for $URL"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run Playwright tests against production
        run: npx playwright test
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore