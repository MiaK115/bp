name: .NET Minimal CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Run Tests and Audit Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BPCalculator.sln

      - name: Build solution
        run: dotnet build BPCalculator.sln --configuration Release --no-restore

      - name: Run tests with coverage (fail if <70%)
        run: >
          dotnet test BPCalculator.sln --no-build --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutput=./TestResults/Coverage/
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=70
          /p:ThresholdType=line

      - name: List coverage files
        run: |
          set -eux
          find . -name coverage.cobertura.xml -print || true

      - name: Generate coverage report
        run: |
          dotnet tool update -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:**/TestResults/**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:Html;TextSummary

      - name: Show coverage in logs
        run: cat coverage-report/Summary.txt || true

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: ignore

      - name: Audit .NET Packages for Vulnerabilities
        run: dotnet list package --vulnerable
