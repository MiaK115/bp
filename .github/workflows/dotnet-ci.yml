name: .NET CI Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, Coverage, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit & BDD Tests with Coverage
        run: |
          dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Find coverage file
        id: coverage
        run: |
          echo "##[debug] Locating coverage file..."
          path=$(find . -type f -name 'coverage.cobertura.xml' | head -n 1)
          echo "Found coverage file at: $path"
          echo "path=$path" >> $GITHUB_OUTPUT

      - name: Generate Code Coverage Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.1.26
        with:
          reports: ${{ steps.coverage.outputs.path }}
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline_AzurePipelines'

      - name: Archive Code Coverage Report
        run: |
          zip -r code-coverage-report.zip coveragereport

      - name: Show Coverage File Path
        run: |
          echo "Coverage report saved as: ${{ github.workspace }}/code-coverage-report.zip"

      - name: Audit .NET Dependencies
        run: dotnet list package --vulnerable --no-build