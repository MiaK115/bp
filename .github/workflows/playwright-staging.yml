name: Playwright Staging E2E Tests

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://bp-calculator-staging.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers & deps
        run: npx playwright install --with-deps

      # Warm up Render until the real app HTML is served
      - name: Warm up staging (wait for 200 + real HTML)
        run: |
          URL="${BASE_URL}"
          echo "Warming up $URL ..."
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" -eq 200 ]; then
              BODY=$(curl -s "$URL")
              # Look for stable text from YOUR app page (adjust if needed)
              echo "$BODY" | grep -qiE "Systolic|Diastolic|Blood Pressure" && echo "App is ready" && exit 0
            fi
            echo "[$i/60] Not ready yet (status=$STATUS). Sleeping 5s..."
            sleep 5
          done
          echo "Staging did not become ready in time"
          exit 1

      - name: Run Playwright tests against staging
        run: npx playwright test
        env:
          BASE_URL: ${{ env.BASE_URL }}

      #  upload artifacts so you can inspect failures
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
